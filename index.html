function getFlexDrills(type, benchmarks) {
 const p = FLEX_PROG[type];
 if (!p) return [];
 if (type === 'neck') return p.drills;
 const lvl = parseInt(benchmarks[type+'_level'] || benchmarks['pancake_level']) || 1;
 const phase = p.phases.find(ph => ph.levels.includes(lvl)) || p.phases[0];
 return phase.drills;
}

function useStorage(key, fallback) {
 const [val, setVal] = useState(() => {
  try {
   const s = localStorage.getItem(key);
   if (!s || s === 'undefined' || s === 'null') return fallback;
   return JSON.parse(s);
  } catch { return fallback; }
 });
 function set(v) {
  setVal(v);
  try { localStorage.setItem(key, JSON.stringify(v)); } catch {}
 }
 return [val, set];
}

// ─── VAULT (File System Access API + IndexedDB) ───────────────────────────────
let _vaultHandle = null;

async function _openIDB() {
 return new Promise((res,rej) => {
  const r = indexedDB.open('training-os',1);
  r.onupgradeneeded = e => e.target.result.createObjectStore('kv');
  r.onsuccess = e => res(e.target.result);
  r.onerror = rej;
 });
}
async function _idbGet(db,key) {
 return new Promise((res,rej) => {
  const r = db.transaction('kv','readonly').objectStore('kv').get(key);
  r.onsuccess = e => res(e.target.result);
  r.onerror = rej;
 });
}
async function _idbSet(db,key,val) {
 return new Promise((res,rej) => {
  const r = db.transaction('kv','readwrite').objectStore('kv').put(val,key);
  r.onsuccess = res; r.onerror = rej;
 });
}
async function loadVaultHandle() {
 try {
  const db = await _openIDB();
  _vaultHandle = await _idbGet(db,'vault_handle') || null;
 } catch {}
}
async function pickVault() {
 try {
  const h = await window.showDirectoryPicker({mode:'readwrite',startIn:'documents'});
  _vaultHandle = h;
  const db = await _openIDB();
  await _idbSet(db,'vault_handle',h);
  return true;
 } catch { return false; }
}
async function writeVaultFile(path, content) {
 if (!_vaultHandle) return false;
 try {
  let dir = _vaultHandle;
  // request permission if needed
  if ((await dir.queryPermission({mode:'readwrite'})) !== 'granted') {
   if ((await dir.requestPermission({mode:'readwrite'})) !== 'granted') return false;
  }
  const parts = path.split('/');
  for (const part of parts.slice(0,-1)) {
   dir = await dir.getDirectoryHandle(part,{create:true});
  }
  const file = await dir.getFileHandle(parts.at(-1),{create:true});
  const w = await file.createWritable();
  await w.write(content);
  await w.close();
  return true;
 } catch(e) { console.warn('vault write failed',e); return false; }
}
function vaultFallback(filename, content) {
 // URI scheme fallback — opens Obsidian directly
 const name = encodeURIComponent('Health/Training/'+filename);
 const body = encodeURIComponent(content);
 const uri = 'obsidian://new?name='+name+'&content='+body;
 if (uri.length < 8000) {
  window.location.href = uri;
 } else {
  // Too long for URI — copy to clipboard
  navigator.clipboard.writeText(content).then(() =>
   alert('Note copied to clipboard — paste into Obsidian.')
  ).catch(() => alert('Note generated but could not copy. Set up vault folder in Data tab.'));
 }
}

// ─── UTILITIES ───────────────────────────────────────────────────────────────
function fmtTime(secs) {
 const h = Math.floor(secs/3600);
 const m = Math.floor((secs%3600)/60);
 const s = secs%60;
 if(h>0) return h+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
 return m+':'+String(s).padStart(2,'0');
}
function todayStr() { return new Date().toISOString().slice(0,10); }
function logKey(phaseIdx,dayId,week) { return 'p'+phaseIdx+'_d'+dayId+'_w'+week; }
function flexKey(dayId,week) { return 'fx_'+dayId+'_w'+week; }

function adaptExercise(ex, benchmarks) {
 const b = k => parseInt(benchmarks[k])||0;
 const name = (ex.ex||'').toLowerCase();
 if(name.includes('pistol')&&!name.includes('weighted')) {
  const l=b('pistol_level');
  if(l<=1) return {ex:'Assisted Pistol Negative',note:'Hold ring/TRX. Lower 5s to box.'};
  if(l===2) return {ex:'Box Pistol (high box 40cm)',note:'Sit back to box. Drive through heel.'};
  if(l===3) return {ex:'Heel-Elevated Pistol',note:'Small plate under heel.'};
  if(l===4) return {ex:'Box Pistol (low box 20cm)',note:'Building to free pistol.'};
 }
 if(name.includes('nordic')) {
  const l=b('nordic_level');
  if(l<=1) return {ex:'Nordic Curl Negative (3s)',note:'Slow 3s descent. Assisted return.'};
  if(l===2) return {ex:'Nordic Curl Negative (5s)',note:'5s descent. Build to full nordic.'};
 }
 if((name.includes('wall hspu')||name.includes('elevated pike'))&&!name.includes('free')) {
  const l=b('hspu_level');
  if(l<=1) return {ex:'Pike Push-Up',note:'Hips high. Head between hands.'};
  if(l===2) return {ex:'Feet-Elevated Pike Push-Up',note:'Box 40-60cm. Steeper angle.'};
  if(l===3) return {ex:'Wall HSPU (1 rep goal)',note:'Work up to first clean rep.'};
 }
 return null;
}

function sessionMD(params) {

 const mins = Math.floor(duration/60), secs = duration%60;
 const d = new Date(date);
 const dateStr = d.toLocaleDateString('en-AU',{weekday:'long',day:'numeric',month:'long',year:'numeric'});

 const skillDrills = SKILLS[day.skillBlock.skill]
  ? SKILLS[day.skillBlock.skill].phases[Math.min(phase.id-1,2)].drills
  : [];

 const skillLines = skillDrills.map((dr,i)=>
  (skillChecks[i]?'- [x] ':'- [ ] ')+dr.name+' — '+dr.sets
 ).join('\n');

 const setsTable = day.sets.map((s,i)=>{
  const adapted = adaptExercise(s,benchmarks||{});

  const reps = setReps[i]||'';
  const wt = setWeights[i]?` @${setWeights[i]}kg`:'';
  return '| '+(i+1)+' | '+name+' | '+s.cat+' | '+s.rx+' | '+reps+wt+' |';
 }).join('\n');

 const coreLines = day.core.map((c,i)=>
  (coreChecks[i]?'- [x] ':'- [ ] ')+c.ex+' — '+c.rx
 ).join('\n');

 const cdLines = day.cooldown.map((c,i)=>
  (cooldownChecks[i]?'- [x] ':'- [ ] ')+c
 ).join('\n');

 const neckLines = day.neck.map((n,i)=>
  (neckChecks[i]?'- [x] ':'- [ ] ')+n.ex+' — '+n.rx
 ).join('\n');

 return `---
date: ${date}
type: training
phase: ${phase.id}
phase_name: ${phase.name}
week: ${week}
day: ${day.id}
duration_mins: ${mins}

> ${day.skillBlock.note}

${skillLines}

| # | Exercise | Cat | Target | Logged |
|---|----------|-----|--------|--------|
${setsTable}

${coreLines}

## Cool-down
${cdLines}

## Neck
${neckLines}

## Notes
${notes||'_No notes._'}

---
*Training OS · [[Training Home]] · [[Week ${week}]]*`;

function flexMD(params) {

  ).join('\n');

 }).join('\n\n');

 return `---
date: ${date}
type: flex

  if(!startTime){setSecs(0);return;}

 },[startTime]);

    <${Card} key=${q.id}>
     <div style=${{fontWeight:700,fontSize:13,color:C.navy,marginBottom:10}}>${q.label}</div>
     ${q.type==='scale'&&html`<div style=${{display:'flex',gap:6}}>
      ${q.options.map(o=>html`
       <div key=${o} onClick=${()=>setForm(p=>({...p,[q.id]:o}))}
        style=${{flex:1,padding:'10px 4px',borderRadius:8,border:'2px solid',textAlign:'center',
         cursor:'pointer',fontSize:12,fontWeight:700,
         borderColor:form[q.id]===o?C.green:'#eee',
         background:form[q.id]===o?'#e8f4f0':'#fff',
         color:form[q.id]===o?C.green:C.navy}}>${o}</div>
      `)}
     </div>`}
     ${q.type==='text'&&html`<input type="text" placeholder=${q.placeholder}
      value=${form[q.id]||''}
      onChange=${e=>setForm(p=>({...p,[q.id]:e.target.value}))}
      style=${{width:'100%',padding:'9px 12px',borderRadius:8,border:'1px solid #ddd',
       fontSize:13,boxSizing:'border-box',background:'#fafafa'}}/>`}
     ${q.type==='number'&&html`<input type="number" placeholder=${q.placeholder} step="0.1"
      value=${form[q.id]||''}
      onChange=${e=>setForm(p=>({...p,[q.id]:e.target.value}))}
      style=${{width:'100%',padding:'9px 12px',borderRadius:8,border:'1px solid #ddd',
       fontSize:13,boxSizing:'border-box',background:'#fafafa'}}/>`}
    <//>
   `)}
   <${Btn} onClick=${submit} color=${PHASE_COL[phaseIdx]}>Submit Check-in<//>
  </div>`;
 }

 // ─────────────────────────────────────────────────────────────────────────────
 // DATA TAB
 // ─────────────────────────────────────────────────────────────────────────────
 function DataTab() {
  const sessions = Object.keys(workoutLogs).filter(k=>workoutLogs[k].completed).length;

  function doExport() {
   const data = {
    version:'6.0.0',exportDate:new Date().toISOString(),
    phaseIdx,currentWeek,milestones,workoutLogs,flexLogs,
    benchmarks,checkins,hsPractice,
   };
   const a = document.createElement('a');
   a.href = URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));
   a.download = 'TrainingOS_backup_'+todayStr()+'.json';
   a.click();
  }

  function doImport(e) {
   const file = e.target.files[0];
   if(!file) return;
   const r = new FileReader();
   r.onload = ev => {
    try {
     const d = JSON.parse(ev.target.result);
     if(d.phaseIdx!==undefined) setPhaseIdx(d.phaseIdx);
     if(d.currentWeek) setCurrentWeek(d.currentWeek);
     if(d.milestones)  setMilestones(d.milestones);
     if(d.workoutLogs) setWorkoutLogs(d.workoutLogs);
     if(d.flexLogs)    setFlexLogs(d.flexLogs);
     if(d.benchmarks)  setBenchmarks(d.benchmarks);
     if(d.checkins)    setCheckins(d.checkins);
     if(d.hsPractice)  setHsPractice(d.hsPractice);
     alert('Data restored successfully!');
    } catch { alert('Import failed — file may be corrupted.'); }
   };
   r.readAsText(file);
  }

  return html`<div style=${{padding:16}}>
   <div style=${{fontWeight:800,fontSize:18,color:C.navy,marginBottom:4}}>Data & Vault</div>
   <div style=${{fontSize:12,color:'#888',marginBottom:16}}>
    Your data lives on this device. Export regularly.
   </div>

   <!-- Stats -->
   <div style=${{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:10,marginBottom:14}}>
    ${[['💪',sessions,'Sessions'],['📋',checkins.length,'Check-ins'],
       ['📊',Object.keys(benchmarks).filter(k=>benchmarks[k]).length,'Benchmarks']
    ].map(([ic,n,lb])=>html`
     <div style=${{background:'#fff',border:'1px solid #eee',borderRadius:12,padding:12,textAlign:'center'}}>
      <div style=${{fontSize:20}}>${ic}</div>
      <div style=${{fontSize:20,fontWeight:800,color:C.navy}}>${n}</div>
      <div style=${{fontSize:10,color:'#aaa',textTransform:'uppercase',letterSpacing:1,marginTop:2}}>${lb}</div>
     </div>
    `)}
   </div>

   <!-- Obsidian vault -->
   <${Card} style=${{border:'1px solid '+(vaultReady?C.green:'#ddd')}}>
    <div style=${{fontWeight:700,fontSize:14,color:C.navy,marginBottom:4}}>
     📁 Obsidian Vault ${vaultReady?html`<span style=${{fontSize:11,color:C.green}}>● Connected</span>`:
      html`<span style=${{fontSize:11,color:'#999'}}>○ Not set up</span>`}
    </div>
    <div style=${{fontSize:12,color:'#888',marginBottom:12,lineHeight:1.6}}>
     Grant access to your Obsidian vault folder once. Sessions and check-ins 
     write to <code>Health/Training/</code> automatically. Syncthing handles the rest.
    </div>
    <${Btn} onClick=${async()=>{const ok=await pickVault();if(ok)setVaultReady(true);}}
     outline color=${C.green} small>
     ${vaultReady?'Change vault folder':'Set up vault folder'}
    <//>
   <//>

   <!-- Backup -->
   <${Card}>
    <div style=${{fontWeight:700,fontSize:14,color:C.navy,marginBottom:10}}>Backup & Restore</div>
    <div style=${{marginBottom:10}}>
     <${Btn} onClick=${doExport} outline small>📥 Export JSON backup<//>
    </div>
    <label style=${{display:'block',width:'100%',padding:'10px',borderRadius:12,
     border:'2px solid #ddd',textAlign:'center',cursor:'pointer',
     fontSize:13,fontWeight:700,color:'#666',background:'#f9f9f9',boxSizing:'border-box'}}>
     📤 Import from backup
     <input type="file" accept=".json" onChange=${doImport}
      style=${{display:'none'}}/>
    </label>
   <//>

   <!-- Danger -->
   <${Card} style=${{border:'1px solid #fde0e0'}}>
    <div style=${{fontWeight:700,fontSize:14,color:'#c62828',marginBottom:10}}>Reset</div>
    <${Btn} color="#c62828" outline small
     onClick=${()=>{if(confirm('Reset ALL data? This cannot be undone.')){
      localStorage.clear();window.location.reload();
     }}}>
     Reset all data
    <//>
   <//>
  </div>`;
 }

 // ─────────────────────────────────────────────────────────────────────────────
 // MAIN RENDER
 // ─────────────────────────────────────────────────────────────────────────────
 const tabs = [
  {id:'dashboard',icon:'⚡',label:'Home'},
  {id:'log',      icon:'📓',label:'Log'},
  {id:'bench',    icon:'📊',label:'Tests'},
  {id:'checkin',  icon:'📋',label:'Check-in'},
  {id:'data',     icon:'💾',label:'Data'},
 ];

 return html`<div>
  ${tab==='dashboard'&&html`<${DashTab}/>`}
  ${tab==='log'      &&html`<${LogTab}/>`}
  ${tab==='bench'    &&html`<${BenchTab}/>`}
  ${tab==='checkin'  &&html`<${CheckInTab}/>`}
  ${tab==='data'     &&html`<${DataTab}/>`}

  <!-- Bottom nav -->
  <div style=${{position:'fixed',bottom:0,left:'50%',transform:'translateX(-50%)',
   width:'100%',maxWidth:'800px',background:'#fff',borderTop:'1px solid #eee',
   display:'flex',zIndex:9000,paddingBottom:'env(safe-area-inset-bottom,0px)'}}>
   ${tabs.map(t=>html`
    <button key=${t.id} onClick=${()=>setTab(t.id)} style=${{
     flex:1,padding:'10px 4px',border:'none',background:'none',
     fontFamily:'inherit',cursor:'pointer',
     borderTop:tab===t.id?'2px solid '+C.navy:'2px solid transparent'}}>
     <div style=${{fontSize:18}}>${t.icon}</div>
     <div style=${{fontSize:9,fontWeight:700,textTransform:'uppercase',letterSpacing:.5,marginTop:2,
      color:tab===t.id?C.navy:'#bbb'}}>${t.label}</div>
    </button>
   `)}
  </div>
 </div>`;
}

// ─── MOUNT ───────────────────────────────────────────────────────────────────
loadVaultHandle().then(()=>{
 render(html`<${App}/>`, document.getElementById('root'));
});

</script>

<script>
if('serviceWorker' in navigator){
 const sw=`const CACHE='tos-v515';
self.addEventListener('install',e=>{e.waitUntil(caches.open(CACHE).then(c=>c.addAll([self.location.href])));self.skipWaiting();});
self.addEventListener('activate',e=>{e.waitUntil(caches.keys().then(ks=>Promise.all(ks.filter(k=>k!==CACHE).map(k=>caches.delete(k)))));});
self.addEventListener('fetch',e=>{e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request)));});`;
 navigator.serviceWorker.register(URL.createObjectURL(new Blob([sw],{type:'application/javascript'})));
}
</script>
